<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio of Alviya Anna Sabu, Electronics and Computer Engineering graduate interested in AI, Python, SQL, and technology.">
  <title>Alviya Anna Sabu | Personal Portfolio</title>

  <style>
    :root {
      --bg: #f6f8fc;
      --white: #ffffff;
      --dark: #172554;
      --accent: #6558d3;
      --light: #eeecff;
      --text: #354158;
      --muted: #718096;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1100px, 90%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
    }

    nav {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--dark);
    }

    .brand span {
      color: var(--accent);
    }

    .navlinks {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .navlinks a {
      font-size: 0.92rem;
      font-weight: 600;
    }

    .navlinks a:hover,
    .text-link:hover {
      color: var(--accent);
    }

    .menu {
      display: none;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    .hero {
      min-height: 590px;
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      align-items: center;
      gap: 55px;
      padding-top: 65px;
      padding-bottom: 65px;
    }

    .eyebrow,
    .kicker {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0;
      color: var(--dark);
      font-size: clamp(2.6rem, 5vw, 4.5rem);
      line-height: 1.12;
      letter-spacing: -2px;
    }

    h1 em {
      color: var(--accent);
      font-style: normal;
    }

    .lead {
      max-width: 620px;
      font-size: 1.08rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.primary {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    .profile-card {
      padding: 35px 28px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--white);
      box-shadow: 0 20px 60px rgba(23, 37, 84, 0.08);
    }

    .avatar {
      width: 100px;
      height: 100px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 24px;
      background: var(--light);
      color: var(--accent);
      font-size: 2.5rem;
      font-weight: 800;
    }

    .card-label {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .profile-card h2 {
      margin: 8px 0;
      color: var(--dark);
      font-size: 1.7rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .chip {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 20px;
      background: var(--light);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
    }

    section {
      padding: 85px 0;
    }

    section:nth-of-type(even) {
      background: white;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 25px;
      margin-bottom: 35px;
    }

    .section-head h2,
    .contact h2 {
      margin-top: 10px;
      color: var(--dark);
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      line-height: 1.25;
    }

    .section-head > p {
      max-width: 430px;
      color: var(--muted);
    }

    .about-grid,
    .skill-grid,
    .projects,
    .education-grid,
    .language-grid {
      display: grid;
      gap: 20px;
    }

    .about-grid {
      grid-template-columns: 1.2fr 0.8fr;
    }

    .skill-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .projects {
      grid-template-columns: repeat(2, 1fr);
    }

    .education-grid {
      grid-template-columns: 1fr 1fr;
    }

    .language-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .panel,
    .skill,
    .project,
    .education,
    .language,
    .cert {
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
    }

    .panel h3,
    .skill h3,
    .project h3,
    .education h3,
    .language h3,
    .cert h3 {
      margin-bottom: 10px;
      color: var(--dark);
    }

    .panel p,
    .skill p,
    .project p,
    .education p,
    .language p,
    .cert p {
      color: var(--muted);
    }

    .symbol {
      margin-bottom: 15px;
      color: var(--accent);
      font-size: 1.7rem;
    }

    .skill:hover,
    .project:hover,
    .education:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      transition: 0.2s;
    }

    .project-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .text-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--accent);
      font-weight: 700;
    }

    .date {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .education {
      margin-bottom: 5px;
    }

    .education p {
      margin-top: 5px;
    }

    .soft-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .soft-skills span {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      font-weight: 600;
    }

    .contact {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      align-items: center;
      padding: 40px;
      border-radius: 24px;
      background: var(--dark);
      color: white;
    }

    .contact h2 {
      color: white;
    }

    .contact p {
      margin-top: 15px;
      color: #cbd5e1;
    }

    .contact-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .contact-actions .btn {
      min-width: 220px;
    }

    footer {
      padding: 25px 0;
      background: white;
      border-top: 1px solid var(--border);
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .foot a {
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 800px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .about-grid,
      .contact {
        grid-template-columns: 1fr;
      }

      .skill-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .section-head {
        display: block;
      }

      .section-head > p {
        margin-top: 15px;
      }
    }

    @media (max-width: 600px) {
      .menu {
        display: block;
      }

      .navlinks {
        display: none;
        position: absolute;
        top: 72px;
        left: 0;
        right: 0;
        padding: 20px 5%;
        background: white;
        border-bottom: 1px solid var(--border);
        flex-direction: column;
        align-items: flex-start;
      }

      .navlinks.open {
        display: flex;
      }

      .skill-grid,
      .projects,
      .education-grid,
      .language-grid {
        grid-template-columns: 1fr;
      }

      section {
        padding: 60px 0;
      }

      .contact {
        padding: 28px 22px;
      }

      .foot {
        flex-direction: column;
      }

      h1 {
        letter-spacing: -1px;
      }
    }
  </style>
</head>
